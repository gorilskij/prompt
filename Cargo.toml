[package]
name = "prompt"
version = "0.1.0"
edition = "2024"
description = "A fast, configurable shell prompt with git-state detection"
license = "MIT"
repository = "https://github.com/gorilskij/prompt"
homepage = "https://github.com/gorilskij/prompt"
keywords = ["prompt", "shell", "git", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "prompt"
path = "src/main.rs"

[dependencies]
colored = "3"
dirs = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.22"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
